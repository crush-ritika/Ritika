
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <title>Stay a Little Longer 🌙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #08090d;
      color: #e9edf5;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
    }

    .back {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #e9edf5;
      background: #171b25;
      border: 1px solid #394254;
      border-radius: 12px;
      padding: 11px 15px;
      text-decoration: none;
    }

    h1 {
      font-size: clamp(24px, 6vw, 36px);
      margin: 55px 0 10px;
    }

    p {
      color: #a5aec0;
      line-height: 1.7;
    }

    video {
      width: 100%;
      max-width: 900px;
      max-height: 72vh;
      background: #000;
      border: 1px solid #303746;
      border-radius: 16px;
      object-fit: contain;
    }

    .caption {
      margin-top: 18px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <a class="back" href="index.html">← Back to my world</a>

  <h1>Stay a little longer ☾</h1>
  <p>Take a breath. This little moment is for you. ✨</p>

  <video controls autoplay playsinline preload="metadata">
    <source src="my-video.mp4" type="video/mp4">
    Your browser does not support this video.
  </video>

  <p class="caption">— Alone Guy 🌙</p>
</body>
</html>
